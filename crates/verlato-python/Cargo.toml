[package]
name = "verlato-python"
description = "Python bindings for Verlato (the `verlato._native` extension module)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
verlato = { path = "../verlato" }
# abi3: one wheel per platform serves every CPython from 3.12 on.
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }
