[package]
name = "verlato"
version = "0.2.0"
description = "Semantic release notes powered by IntentumDiff"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "verlato"
path = "src/main.rs"

[features]
# Link the IntentumDiff engine in-process (no Python). Disable only to build/test the
# release-note pipeline without the engine (`--no-default-features`).
default = ["intentumdiff"]
intentumdiff = ["dep:intentumdiff-rust-core"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
rayon = "1.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
intentumdiff-rust-core = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "7ae58e9237e0be07ddf919b6d7a7cbc8a1333983", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
