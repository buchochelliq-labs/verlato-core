name: CI

on:
  push:
    branches: [main, feature/initial]
  pull_request:
  # The release workflow (release.yml) runs CI on the tagged commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}    # empty on push and pull_request: the default
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Provision the IntentumDiff parser bundle
        run: scripts/fetch_intentumdiff_parsers.sh python/verlato/wasm
      - name: Install the verlato package (maturin)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      # The package tests and the parity suite, which replays the retired Python
      # implementation's answers (tests/golden) against the native runtime.
      - name: Tests
        run: pytest
      - name: CLI reference is current (docs/reference/cli.md)
        run: python3 scripts/gen_cli_reference.py --check
      - name: Release configuration (rab)
        run: |
          python -m pip install --quiet pyyaml
          python3 .github/rab/scripts/release.py check
          python3 .github/rab/scripts/release.py vendored

  # Builds the wheel the way the release does (rab's maturin step: maturin-action with
  # `manylinux: auto`, so the Linux wheel is built in the manylinux2014 container, glibc 2.17)
  # and installs it in a fresh venv, so a wheel that builds but cannot be imported fails the PR
  # rather than the release (0.2.0's Linux wheels imported with "undefined symbol: le16toh").
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Provision the IntentumDiff parser bundle
        run: scripts/fetch_intentumdiff_parsers.sh python/verlato/wasm
      # Same action, pin and arguments as .github/rab/build/action.yml.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          sccache: "false"
      - name: Install and use the wheel (scripts/test_wheel.sh)
        run: scripts/test_wheel.sh dist/*.whl

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
