name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy verlato
      - name: Tests
        run: pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python implementation (parity reference + delegate)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Build native verlato (links IntentumDiff)
        run: cargo build --release -p verlato
      - name: Provision IntentumDiff parser bundle
        run: scripts/fetch_intentumdiff_parsers.sh
      - name: Rust tests
        run: cargo test --release -p verlato
      - name: Parity with the Python implementation
        run: pytest tests/test_rust_parity.py
