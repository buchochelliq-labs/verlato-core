# Verlato's implementation: the `verlato` crate (crates/verlato, library + executable) and its
# Python bindings (crates/verlato-python, the `verlato._native` extension module the `verlato`
# PyPI package ships). See docs/RUST_MIGRATION.md.
[workspace]
members = ["crates/verlato", "crates/verlato-python"]
resolver = "2"

[workspace.package]
# The one version: the crates, the Python package (pyproject.toml `dynamic = ["version"]`) and
# the release bundles all take it from here.
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1
strip = true

# The IntentumDiff engine's build graph needs its first-party patched crates; patch sections
# only apply at the consuming workspace root, so they are repeated here (mirrors
# intentumdiff-core/crates/cli/Cargo.toml at the pinned revision).
[patch.crates-io]
quote = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "7ae58e9237e0be07ddf919b6d7a7cbc8a1333983" }
zmij = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "7ae58e9237e0be07ddf919b6d7a7cbc8a1333983" }
