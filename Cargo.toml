# Verlato's implementation: the `verlato` crate (crates/verlato, library + executable) and its
# Python bindings (crates/verlato-python, the `verlato._native` extension module the `verlato`
# PyPI package ships). See docs/technical/rust-migration.md.
[workspace]
members = ["crates/verlato", "crates/verlato-python"]
resolver = "2"

[workspace.package]
# The one version: the crates, the Python package (pyproject.toml `dynamic = ["version"]`) and
# the release bundles all take it from here.
version = "0.2.0-beta.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/buchochelliq-labs/verlato-core"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1
strip = true

# The IntentumDiff engine's build graph needs its first-party patched crates; patch sections
# only apply at the consuming workspace root, so they are repeated here (mirrors
# intentumdiff-core/crates/cli/Cargo.toml at the pinned revision, except its `serde_core` patch:
# that patch is for 1.0.228 and goes unused in the core's own build too, which resolves 1.0.229).
[patch.crates-io]
quote = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "1c4bdbc5dfbe6e738b3d70d8964e7f148d711821" }
zmij = { git = "https://github.com/buchochelliq-labs/intentumdiff-core", rev = "1c4bdbc5dfbe6e738b3d70d8964e7f148d711821" }
